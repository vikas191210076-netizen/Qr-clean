
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR-CLEAN | Report Garbage</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #dff7e5, #e5efff);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 430px;
      background: white;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 5px 20px #00000018;
    }

    h1 {
      text-align: center;
      color: #16834a;
      margin-top: 0;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 22px;
    }

    .bin {
      background: #e9f8ee;
      padding: 14px;
      border-radius: 10px;
      margin-bottom: 20px;
      line-height: 1.7;
    }

    label {
      display: block;
      font-weight: bold;
      margin: 15px 0 8px;
    }

    select, textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      background: white;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 20px;
      background: #16834a;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
    }

    #message {
      margin-top: 16px;
      text-align: center;
      overflow-wrap: anywhere;
      line-height: 1.5;
    }

    .success {
      color: #16834a;
    }

    .error {
      color: #c62828;
    }

    .note {
      font-size: 12px;
      color: #666;
      text-align: center;
      margin-top: 18px;
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>QR-CLEAN</h1>
    <p class="subtitle">Help us keep our campus clean!</p>

    <div class="bin">
      <strong>Dustbin ID:</strong> <span id="binId">Checking...</span><br>
      <strong>Location:</strong> <span id="binLocation">Checking...</span>
    </div>

    <form id="reportForm">
      <label for="issue">Select the problem</label>

      <select id="issue" required>
        <option value="">Choose an issue</option>
        <option>Dustbin Full</option>
        <option>Garbage Overflowing</option>
        <option>Bad Smell</option>
        <option>Dustbin Damaged</option>
        <option>Other</option>
      </select>

      <label for="details">Additional details (optional)</label>

      <textarea
        id="details"
        maxlength="500"
        placeholder="Describe the problem..."
      ></textarea>

      <button id="submitBtn" type="submit">
        Submit Report
      </button>

      <p id="message" role="status" aria-live="polite"></p>
    </form>

    <p class="note">
      QR-CLEAN · Campus Garbage Reporting System
    </p>
  </main>

  <script type="module">
    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";

    import {
      getFirestore,
      collection,
      addDoc,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

    // STEP 1: Copy your existing Firebase settings from login.html.
    const firebaseConfig = {
      apiKey: "PASTE_YOUR_API_KEY",
      authDomain: "PASTE_YOUR_AUTH_DOMAIN",
      projectId: "PASTE_YOUR_PROJECT_ID",
      storageBucket: "PASTE_YOUR_STORAGE_BUCKET",
      messagingSenderId: "PASTE_YOUR_MESSAGING_SENDER_ID",
      appId: "PASTE_YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Only these three registered bins are accepted.
    const bins = {
      "BIN-001": "Main Gate",
      "BIN-002": "Canteen",
      "BIN-003": "Library"
    };

    const params = new URLSearchParams(window.location.search);
    const binId = params.get("bin");
    const binLocation = bins[binId];

    const binIdElement = document.getElementById("binId");
    const locationElement = document.getElementById("binLocation");
    const form = document.getElementById("reportForm");
    const submitBtn = document.getElementById("submitBtn");
    const message = document.getElementById("message");

    if (binLocation) {
      binIdElement.textContent = binId;
      locationElement.textContent = binLocation;
    } else {
      binIdElement.textContent = "Invalid QR code";
      locationElement.textContent = "Unknown location";
      form.querySelectorAll("select, textarea, button")
        .forEach(element => element.disabled = true);

      message.textContent =
        "Invalid dustbin QR code. Please scan a registered bin.";
      message.className = "error";
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      if (!binLocation) return;

      const issue = document.getElementById("issue").value;
      const details = document.getElementById("details").value.trim();

      if (!issue) {
        message.textContent = "Please select an issue.";
        message.className = "error";
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "Submitting...";
      message.textContent = "Saving your report...";
      message.className = "";

      try {
        await addDoc(collection(db, "reports"), {
          binId: binId,
          binLocation: binLocation,
          issue: issue,
          details: details,
          status: "Pending",
          createdAt: serverTimestamp()
        });

        message.textContent =
          "Report submitted successfully! Thank you for helping keep our campus clean.";
        message.className = "success";

        form.reset();
        submitBtn.textContent = "Report Submitted";
      } catch (error) {
        console.error("Report submission error:", error);

        message.textContent =
          "Report was not saved. Please check your Firebase settings and Firestore rules, then try again.";
        message.className = "error";

        submitBtn.disabled = false;
        submitBtn.textContent = "Submit Report";
      }
    });
  </script>
</body>
</html>
