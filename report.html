
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR-CLEAN | Public Garbage Reporting</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #e8f5e9, #e3f2fd);
      color: #183329;
    }

    .container {
      max-width: 520px;
      margin: 20px auto;
      padding: 24px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 5px 24px #00000015;
    }

    h1 { margin-bottom: 8px; color: #137547; }
    .subtitle { color: #53665c; line-height: 1.5; }

    label {
      display: block;
      margin-top: 17px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input, select, textarea, button {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border-radius: 9px;
    }

    input, select, textarea {
      border: 1px solid #bdcfc3;
      background: #fff;
    }

    textarea { min-height: 95px; resize: vertical; }

    button {
      margin-top: 20px;
      border: none;
      background: #16834a;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled { opacity: .6; cursor: wait; }

    #message {
      margin-top: 16px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    #preview {
      display: none;
      width: 100%;
      max-height: 260px;
      object-fit: contain;
      margin-top: 12px;
      border-radius: 10px;
    }

    .small { font-size: 13px; color: #59685f; }
  </style>
</head>

<body>
  <main class="container">
    <h1>QR-CLEAN</h1>
    <p><strong>A Cleaner Public Space Starts With You.</strong></p>
    <p class="subtitle">
      Report overflowing dustbins, bad smells, or damaged bins
      in registered public locations.
    </p>

    <p id="binInfo">Checking registered dustbin...</p>

    <form id="reportForm">
      <label for="issue">Select the issue</label>
      <select id="issue" required>
        <option value="">Choose an issue</option>
        <option>Dustbin Full</option>
        <option>Garbage Overflowing</option>
        <option>Bad Smell</option>
        <option>Dustbin Damaged</option>
        <option>Other</option>
      </select>

      <label for="details">Additional details</label>
      <textarea id="details" maxlength="500"
        placeholder="Describe the problem (optional)"></textarea>

      <label for="photo">Photo proof (optional)</label>
   <label for="photo">📸 Take a Photo of the Dustbin</label>

<input
  id="photo"
  type="file"
  accept="image/*"
  capture="environment"
  required
>
      <p class="small">
        JPG, PNG or WebP only. Maximum size: 5 MB.
        Avoid including people's faces or personal information.
      </p>

      <img id="preview" alt="Selected photo preview">

      <button id="submitBtn" type="submit">Submit Report</button>
      <div id="message" role="status" aria-live="polite"></div>
    </form>
  </main>

  <script type="module">
    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";

    import {
      getFirestore, doc, getDoc, addDoc, collection,
      serverTimestamp
    } from
      "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

    // Replace these placeholders with your existing Firebase config.
  const firebaseConfig = {
  apiKey: "AIzaSyCCorpTfMlP2VTtQ3_rsZxxG6iEM4td-Wo",
  authDomain: "qr-clean.firebaseapp.com",
  projectId: "qr-clean",
  storageBucket: "qr-clean.firebasestorage.app",
  messagingSenderId: "853415187571",
  appId: "1:853415187571:web:86b76fe67f51bb7a4d4606",
  measurementId: "G-XFK1JNJBTR"
};
    const CLOUD_NAME = "h0vohb8v";
    const UPLOAD_PRESET = "qr_clean_reports";
    const MAX_SIZE = 5 * 1024 * 1024;

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const params = new URLSearchParams(location.search);
    const binId = (params.get("bin") || "").trim().toUpperCase();

    const binInfo = document.getElementById("binInfo");
    const form = document.getElementById("reportForm");
    const photoInput = document.getElementById("photo");
    const preview = document.getElementById("preview");
    const message = document.getElementById("message");
    const submitBtn = document.getElementById("submitBtn");

    let binData = null;

    function showMessage(text, success = false) {
      message.textContent = text;
      message.style.color = success ? "#137547" : "#b42318";
    }

    async function loadBin() {
      if (!/^BIN-\d{3}$/.test(binId)) {
        binInfo.textContent = "Invalid QR code. Please scan a registered bin.";
        form.hidden = true;
        return;
      }

      try {
        const snap = await getDoc(doc(db, "bins", binId));

        if (!snap.exists() || snap.data().active !== true) {
          binInfo.textContent = "This dustbin is not registered or is inactive.";
          form.hidden = true;
          return;
        }

        binData = snap.data();

        if (typeof binData.location !== "string" ||
            typeof binData.name !== "string") {
          throw new Error("Bin details are incomplete.");
        }

        binInfo.textContent =
          "Dustbin: " + binData.name + " | Location: " + binData.location;
      } catch (error) {
        console.error(error);
        binInfo.textContent =
          "Could not verify this dustbin. Please try again later.";
        form.hidden = true;
      }
    }

    photoInput.addEventListener("change", () => {
      const file = photoInput.files[0];
      preview.style.display = "none";
      preview.removeAttribute("src");

      if (!file) return;

      const allowed = ["image/jpeg", "image/png", "image/webp"];

      if (!allowed.includes(file.type)) {
        photoInput.value = "";
        showMessage("Choose a JPG, PNG, or WebP image.");
        return;
      }

      if (file.size > MAX_SIZE) {
        photoInput.value = "";
        showMessage("Photo must be 5 MB or smaller.");
        return;
      }

      preview.src = URL.createObjectURL(file);
      preview.style.display = "block";
      showMessage("");
    });

    async function uploadPhoto(file) {
      const body = new FormData();
      body.append("file", file);
      body.append("upload_preset", UPLOAD_PRESET);

      const response = await fetch(
        `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`,
        { method: "POST", body }
      );

      const result = await response.json();

      if (!response.ok || !result.secure_url) {
        throw new Error("Photo upload failed. Please try again.");
      }

      return result.secure_url;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      if (!binData) {
        showMessage("A registered dustbin could not be verified.");
        return;
      }

      const issue = document.getElementById("issue").value;
      const details = document.getElementById("details").value.trim();
      const file = photoInput.files[0];

      if (!issue) {
        showMessage("Please select an issue.");
        return;
      }

      if (details.length > 500) {
        showMessage("Details must be 500 characters or fewer.");
        return;
      }

      if (file) {
        const allowed = ["image/jpeg", "image/png", "image/webp"];
        if (!allowed.includes(file.type) || file.size > MAX_SIZE) {
          showMessage("Choose a supported image of 5 MB or less.");
          return;
        }
      }

      submitBtn.disabled = true;
      showMessage("Submitting your report...");

      try {
        let photoUrl = null;

        if (file) {
          showMessage("Uploading photo...");
          photoUrl = await uploadPhoto(file);
        }

        const report = {
          binId,
          binLocation: binData.location,
          issue,
          details,
          status: "Pending",
          createdAt: serverTimestamp()
        };

        if (photoUrl) report.photoUrl = photoUrl;

        await addDoc(collection(db, "reports"), report);

        form.reset();
        preview.style.display = "none";
        preview.removeAttribute("src");

        binInfo.textContent =
          "Report submitted for " + binData.name + ".";
        showMessage("Report submitted successfully. Thank you!", true);
      } catch (error) {
        console.error(error);
        showMessage(error.message || "Submission failed. Please try again.");
      } finally {
        submitBtn.disabled = false;
      }
    });

    await loadBin();
  </script>
</body>
</html>
