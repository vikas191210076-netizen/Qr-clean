
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Login - Dustbin Reporting</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #eef3f0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .login-box {
      background: white;
      padding: 28px;
      width: 85%;
      max-width: 360px;
      border-radius: 14px;
      box-shadow: 0 4px 18px #0002;
    }

    h2 { text-align: center; color: #176b45; }
    label { display: block; margin-top: 15px; }
    input {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin-top: 6px;
      border: 1px solid #ccc;
      border-radius: 7px;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 20px;
      background: #176b45;
      color: white;
      border: none;
      border-radius: 7px;
      font-size: 16px;
      cursor: pointer;
    }

    #message { text-align: center; font-size: 14px; }
  </style>
</head>
<body>
  <div class="login-box">
    <h2>Staff Login</h2>
    <p>Sign in to manage dustbin reports.</p>

    <form id="loginForm">
      <label for="email">Staff Email</label>
      <input id="email" type="email" required>

      <label for="password">Password</label>
      <input id="password" type="password" required>

      <button type="submit">Login</button>
    </form>

    <p id="message" role="status"></p>
  </div>

  <script type="module">
    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword }
      from "https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    document.getElementById("loginForm").addEventListener(
      "submit", async (event) => {
        event.preventDefault();

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        const message = document.getElementById("message");

        message.textContent = "Signing in...";

        try {
          await signInWithEmailAndPassword(auth, email, password);
          message.textContent = "Login successful!";
          // We will add the protected staff dashboard next.
        } catch (error) {
          message.textContent =
            "Login failed. Check your email, password and Firebase settings.";
        }
      }
    );
  </script>
</body>
</html>
